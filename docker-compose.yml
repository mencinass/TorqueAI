services:
  postgres:
    image: postgres:16-alpine
    container_name: automotive-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-automotive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive_pass}
      POSTGRES_DB: ${POSTGRES_DB:-automotive_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-automotive_user} -d ${POSTGRES_DB:-automotive_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - automotive_net

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: automotive-ai-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - automotive_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automotive-ai-backend
    restart: unless-stopped
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-Automotive AI Agent}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      API_V1_PREFIX: ${API_V1_PREFIX:-/api/v1}
      POSTGRES_USER: ${POSTGRES_USER:-automotive_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-automotive_pass}
      POSTGRES_DB: ${POSTGRES_DB:-automotive_db}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-automotive_user}:${POSTGRES_PASSWORD:-automotive_pass}@postgres:5432/${POSTGRES_DB:-automotive_db}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_GRPC_PORT: 6334
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.containers.internal:11434}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-768}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-extractive}
      CHAT_MODEL: ${CHAT_MODEL:-llama3.2:3b}
      CHAT_TIMEOUT: ${CHAT_TIMEOUT:-120}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.2}
      CHAT_MAX_TOKENS: ${CHAT_MAX_TOKENS:-800}
      AUTO_INGEST_ENABLED: ${AUTO_INGEST_ENABLED:-true}
      AUTO_INGEST_FORCE: ${AUTO_INGEST_FORCE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./service_guide:/app/service_guide:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - "host.containers.internal:host-gateway"
    networks:
      - automotive_net

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  automotive_net:
    driver: bridge

